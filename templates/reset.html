<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — 404NOT403</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/public.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="logo">
                <span class="logo-404">404</span><span class="logo-not">NOT</span><span class="logo-403">403</span>
            </div>
            
            <h2 id="form-title">Reset Password</h2>

            <div id="error-msg" class="error-msg" style="display:none;"></div>
            <div id="success-msg" class="success-msg" style="display:none;"></div>

            <!-- Mode 1: Request Reset Link (no token in URL) -->
            <form id="forgot-form" onsubmit="return handleForgot(event)">
                <p style="font-size:0.85rem; color:var(--text-secondary); margin-bottom:1rem; line-height:1.5;">
                    Enter the email address associated with your account and we'll send you a password reset link.
                </p>

                <label for="forgot-email">Email</label>
                <input type="email" id="forgot-email" name="email" required autocomplete="email" placeholder="agent@company.com">

                <button type="submit" id="forgot-submit-btn" class="btn btn-primary btn-full">Send Reset Link</button>
            </form>

            <!-- Mode 2: Set New Password (token in URL) -->
            <form id="reset-form" style="display:none;" onsubmit="return handleReset(event)">
                <p style="font-size:0.85rem; color:var(--text-secondary); margin-bottom:1rem; line-height:1.5;">
                    Create a new secure password for your account.
                </p>

                <label for="reset-password">New Password (12+ characters)</label>
                <input type="password" id="reset-password" name="password" required minlength="12" autocomplete="new-password">

                <label for="reset-confirm">Confirm Password</label>
                <input type="password" id="reset-confirm" name="confirm" required minlength="12" autocomplete="new-password">

                <button type="submit" id="reset-submit-btn" class="btn btn-primary btn-full">Update Password</button>
            </form>

            <div class="auth-links">
                <a href="/login">Back to log in</a>
                <a href="/register">Create account</a>
            </div>
        </div>
    </div>

    <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    const forgotForm = document.getElementById('forgot-form');
    const resetForm = document.getElementById('reset-form');
    const formTitle = document.getElementById('form-title');
    const errEl = document.getElementById('error-msg');
    const succEl = document.getElementById('success-msg');

    if (token) {
        formTitle.textContent = 'Set New Password';
        forgotForm.style.display = 'none';
        resetForm.style.display = 'block';
    }

    async function handleForgot(e) {
        e.preventDefault();
        errEl.style.display = 'none';
        succEl.style.display = 'none';

        const email = document.getElementById('forgot-email').value.trim();
        const btn = document.getElementById('forgot-submit-btn');
        btn.disabled = true;

        try {
            const res = await fetch('/api/auth/forgot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });

            const data = await res.json();
            if (!res.ok) {
                errEl.textContent = data.error || 'Unable to process request';
                errEl.style.display = 'block';
                btn.disabled = false;
                return;
            }

            forgotForm.style.display = 'none';
            succEl.textContent = 'If an account exists for ' + email + ', a password reset link has been sent.';
            succEl.style.display = 'block';
        } catch (err) {
            errEl.textContent = 'Network error. Please try again.';
            errEl.style.display = 'block';
            btn.disabled = false;
        }
    }

    async function handleReset(e) {
        e.preventDefault();
        errEl.style.display = 'none';
        succEl.style.display = 'none';

        const password = document.getElementById('reset-password').value;
        const confirm = document.getElementById('reset-confirm').value;
        const btn = document.getElementById('reset-submit-btn');

        if (password !== confirm) {
            errEl.textContent = 'Passwords do not match';
            errEl.style.display = 'block';
            return;
        }

        if (password.length < 12) {
            errEl.textContent = 'Password must be at least 12 characters';
            errEl.style.display = 'block';
            return;
        }

        btn.disabled = true;

        try {
            const res = await fetch('/api/auth/reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token, password: password })
            });

            const data = await res.json();
            if (!res.ok) {
                errEl.textContent = data.error || 'Reset failed or token expired';
                errEl.style.display = 'block';
                btn.disabled = false;
                return;
            }

            resetForm.style.display = 'none';
            succEl.textContent = 'Password updated successfully. You may now log in.';
            succEl.style.display = 'block';
        } catch (err) {
            errEl.textContent = 'Network error. Please try again.';
            errEl.style.display = 'block';
            btn.disabled = false;
        }
    }
    </script>
</body>
</html>
