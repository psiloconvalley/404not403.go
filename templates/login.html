<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — 404NOT403</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/public.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="logo">
                <span class="logo-404">404</span><span class="logo-not">NOT</span><span class="logo-403">403</span>
            </div>
            <h2>Log In</h2>

            <div id="error-msg" class="error-msg" style="display:none;"></div>

            <form id="login-form" onsubmit="return handleLogin(event)">
                <label for="identifier">Email or Handle</label>
                <input type="text" id="identifier" name="identifier" required autocomplete="username">

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">

                <button type="submit" class="btn btn-primary btn-full">Log In</button>
            </form>

            <div class="auth-links">
                <a href="/reset">Forgot password?</a>
                <a href="/register">Create account</a>
            </div>

            <div class="auth-divider">
                <span>or</span>
            </div>

            <button onclick="passkeyLogin()" class="btn btn-ghost btn-full" id="passkey-btn">
                🔑 Sign in with Passkey
            </button>
        </div>
    </div>

    <script>
    async function handleLogin(e) {
        e.preventDefault();
        const errEl = document.getElementById('error-msg');
        errEl.style.display = 'none';

        const body = {
            identifier: document.getElementById('identifier').value.trim(),
            password: document.getElementById('password').value
        };

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            const data = await res.json();

            if (!res.ok) {
                errEl.textContent = data.error || 'Login failed';
                errEl.style.display = 'block';
                return;
            }

            if (data.mfa_required) {
                errEl.textContent = 'MFA required — not yet supported in this UI';
                errEl.style.display = 'block';
                return;
            }

            window.location.href = '/dashboard';
        } catch (err) {
            errEl.textContent = 'Network error';
            errEl.style.display = 'block';
        }
    }

    async function passkeyLogin() {
        const errEl = document.getElementById('error-msg');
        errEl.style.display = 'none';

        const email = document.getElementById('identifier').value.trim();
        if (!email) {
            errEl.textContent = 'Enter your email first';
            errEl.style.display = 'block';
            return;
        }

        try {
            // Step 1: Begin login
            const beginRes = await fetch('/api/auth/passkey/login/begin', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: email})
            });

            if (!beginRes.ok) {
                const d = await beginRes.json();
                errEl.textContent = d.error || 'No passkey found';
                errEl.style.display = 'block';
                return;
            }

            const data = await beginRes.json();
            const options = data.options;
            const userID = data.user_id;

            // Convert base64url to ArrayBuffer
            options.publicKey.challenge = base64urlToBuffer(options.publicKey.challenge);
            options.publicKey.allowCredentials = (options.publicKey.allowCredentials || []).map(function(c) {
                c.id = base64urlToBuffer(c.id);
                return c;
            });

            // Step 2: Browser authenticates
            const assertion = await navigator.credentials.get({publicKey: options.publicKey});

            // Step 3: Send to server
            const body = {
                id: assertion.id,
                rawId: bufferToBase64url(assertion.rawId),
                type: assertion.type,
                response: {
                    authenticatorData: bufferToBase64url(assertion.response.authenticatorData),
                    clientDataJSON: bufferToBase64url(assertion.response.clientDataJSON),
                    signature: bufferToBase64url(assertion.response.signature),
                    userHandle: assertion.response.userHandle ? bufferToBase64url(assertion.response.userHandle) : null
                }
            };

            const finishRes = await fetch('/api/auth/passkey/login/finish?user_id=' + userID, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });

            if (finishRes.ok) {
                window.location.href = '/dashboard';
            } else {
                const d = await finishRes.json();
                errEl.textContent = d.error || 'Passkey login failed';
                errEl.style.display = 'block';
            }
        } catch (err) {
            errEl.textContent = 'Passkey cancelled or not supported';
            errEl.style.display = 'block';
        }
    }

    function base64urlToBuffer(base64url) {
        const base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
        const pad = base64.length % 4;
        const padded = pad ? base64 + '='.repeat(4 - pad) : base64;
        const binary = atob(padded);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes.buffer;
    }

    function bufferToBase64url(buffer) {
        const bytes = new Uint8Array(buffer);
        let binary = '';
        for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
        return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    </script>
</body>
</html>
